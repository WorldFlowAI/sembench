name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check sembench tests
      - run: ruff format --check sembench tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  fixture-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' semblend
      - name: Build fixture manifest twice (determinism)
        run: |
          python -m sembench build --profile fixture --output /tmp/fixture-a.jsonl
          python -m sembench build --profile fixture --output /tmp/fixture-b.jsonl
          cmp /tmp/fixture-a.jsonl /tmp/fixture-b.jsonl
      - name: Offline run
        run: |
          python -m sembench run-offline \
            --manifest /tmp/fixture-a.jsonl \
            --output /tmp/fixture-offline.json \
            --block-size 16
      - name: Acceptance gates (safety invariants)
        run: |
          python -m sembench assert-result-gates \
            --result /tmp/fixture-offline.json \
            --max-negative-control-semantic-placement-rate 0.0
      - name: Frozen-spec integrity (rebuild matches committed checksums)
        run: python -m sembench verify-frozen --spec fixture-v1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
